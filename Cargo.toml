[package]
name = "NVRC"
version = "0.1.7"
edition = "2021"

[dependencies]
nix = { version =  "0.31.3", features = ["fs", "mount", "user", "process", "reboot", "signal", "mman", "poll", "ioctl"] }
cfg-if = "1.0.4"
log = "0.4.29"
kernlog = "0.3"
rlimit = "0.11.0"
libc = "0.2.178"
once_cell = "1.21.3"
sha2 = { version = "0.11", default-features = false }
pcilibs-rs = { git = "https://github.com/kata-containers/pcilibs-rs", rev = "3c08ab7cb05db7fc5362d3bbbac97b301c943174", default-features = false, features = ["std"] }

[profile.release]
opt-level = "z" # PID 1 runs once per boot: size beats speed
lto = true
codegen-units = 1 # one unit gives fat LTO full visibility and a smaller binary
strip = true
panic = 'abort'

[dev-dependencies]
pcilibs-rs = { git = "https://github.com/kata-containers/pcilibs-rs", rev = "3c08ab7cb05db7fc5362d3bbbac97b301c943174", default-features = false, features = ["testfs"] }
mktemp = "0.5.1"
tempfile = "3.23.0"
serial_test = "4.0.1"
rstest = "0.27.0"

[features]
confidential = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
