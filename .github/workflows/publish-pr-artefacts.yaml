name: Publish NVRC from a pull request

# Lets consumers (e.g. kata-containers) test a pull request against real
# artefacts.
#
# Adding the "publish-nvrc-from-pr" label publishes the binaries that the
# "Reproducible build" workflow built for the pull request's current head
# commit. They are packaged exactly like the release assets (signed
# NVRC-<target>.tar.xz with its .sig, .cert and .bundle.json, holding the
# signed binary and its signed SBOM) and pushed as a
# single OCI artifact to a dedicated "nvrc-pr" package, tagged with the head
# sha, so consumers only need to fetch from there instead of the GitHub
# release and pin the sha as the version.
#
# The pull request code is never checked out or run here: it was built by the
# pull_request workflow with a read-only token, and this workflow only signs
# and pushes the resulting binaries. The label is removed afterwards, so every
# new head commit needs a maintainer to add it again.
#
# pull_request builds cannot sign (a fork has no OIDC token), so the signing
# and the provenance attestation happen here, with this workflow's identity.
#
# A single comment on the pull request tracks the latest attempt: it is posted
# as soon as the label is seen and then updated with the artefact reference,
# or with the reason nothing was published.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] PR code is never checked out, only its build artifacts are published.
    types:
      - labeled

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

permissions: {}

env:
  REGISTRY: ghcr.io
  BUILD_WORKFLOW: reproducible.yaml
  TARGETS: x86_64-unknown-linux-musl aarch64-unknown-linux-musl
  COMMENT_MARKER: "<!-- nvrc-pr-artefacts -->"

jobs:
  announce:
    name: Find the build and announce the publication
    if: ${{ github.event.label.name == 'publish-nvrc-from-pr' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read # look up the pull_request build
      pull-requests: write # comment on the pull request
    outputs:
      comment_id: ${{ steps.comment.outputs.comment_id }}
      run_id: ${{ steps.build.outputs.run_id }}
      error: ${{ steps.build.outputs.error }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Does not fail when there is nothing to publish, so the reason reaches
      # the report job through this job's outputs.
      - name: Find the build of the pull request head
        id: build
        run: |
          run="$(gh run list --workflow "${BUILD_WORKFLOW}" --event pull_request \
            --commit "${HEAD_SHA}" --limit 1 --json databaseId,status,conclusion,url \
            --jq '.[0] // empty')"
          if [ -z "${run}" ]; then
            error="No ${BUILD_WORKFLOW} run found for ${HEAD_SHA}; add the label again once it has run."
          elif [ "$(jq -r .status <<< "${run}")" != "completed" ]; then
            error="The [${BUILD_WORKFLOW} run]($(jq -r .url <<< "${run}")) for ${HEAD_SHA} has not finished yet; add the label again once it has."
          elif [ "$(jq -r .conclusion <<< "${run}")" != "success" ]; then
            error="The [${BUILD_WORKFLOW} run]($(jq -r .url <<< "${run}")) for ${HEAD_SHA} ended with \"$(jq -r .conclusion <<< "${run}")\", so there is nothing to publish."
          fi
          if [ -n "${error:-}" ]; then
            echo "::error::${error}"
            echo "error=${error}" >> "${GITHUB_OUTPUT}"
          else
            echo "run_id=$(jq -r .databaseId <<< "${run}")" >> "${GITHUB_OUTPUT}"
          fi

      - name: Post or update the status comment
        id: comment
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "${COMMENT_MARKER}"
            echo "Publishing the NVRC artefacts for ${HEAD_SHA} ([workflow run](${RUN_URL}))."
          } > body.md
          comment_id="$(gh api --paginate "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${COMMENT_MARKER}\"))) | .id" \
            | tail -n 1)"
          if [ -n "${comment_id}" ]; then
            gh api --method PATCH "repos/${GH_REPO}/issues/comments/${comment_id}" -F body=@body.md > /dev/null
          else
            comment_id="$(gh api --method POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
              -F body=@body.md --jq .id)"
          fi
          echo "comment_id=${comment_id}" >> "${GITHUB_OUTPUT}"

  publish:
    name: Sign and publish the artefacts for the pull request head
    needs: announce
    if: ${{ needs.announce.outputs.run_id != '' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read # download the artifacts of the pull_request build
      packages: write # push the artefacts to ghcr.io
      id-token: write # keyless cosign signing of the binaries and tarballs
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_REPO: ${{ github.repository }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ needs.announce.outputs.run_id }}
    steps:
      - name: Download the build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ needs.announce.outputs.run_id }}
        run: gh run download "${RUN_ID}" --pattern 'NVRC-*' --dir artifacts

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # The same Syft that release.yaml's anchore/sbom-action runs, called
      # directly so one step covers every target.
      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # Same layout as the release tarballs (release.yaml), so consumers keep
      # their existing cosign verification and extraction (VERIFY.md).
      - name: Generate SBOMs, sign and package the binaries
        env:
          COSIGN_EXPERIMENTAL: "true"
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euxo pipefail
          mkdir dist
          sign() {
            cosign sign-blob --yes "$1" \
              --output-signature "$1.sig" \
              --output-certificate "$1.cert" \
              --bundle "$1.bundle.json"
          }
          for target in ${TARGETS}; do
            base="NVRC-${target}"
            sbom="sbom-${base}.spdx.json"
            install -m 0755 "artifacts/${base}/${base}" "dist/${base}"
            "${SYFT}" scan "file:dist/${base}" -o "spdx-json=dist/${sbom}"
            sign "dist/${base}"
            sign "dist/${sbom}"
            tar -C dist --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 \
              -cf "dist/${base}.tar" \
              "${base}" "${base}.sig" "${base}.cert" "${base}.bundle.json" \
              "${sbom}" "${sbom}.sig" "${sbom}.cert" "${sbom}.bundle.json"
            xz -T0 -9e -f "dist/${base}.tar"
            sign "dist/${base}.tar.xz"
          done

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish the artefacts
        id: push
        working-directory: dist
        run: |
          set -euxo pipefail
          # ghcr.io only accepts lowercase repository names (NVIDIA/nvrc).
          image="${REGISTRY}/${GH_REPO,,}/nvrc-pr"
          files=()
          for target in ${TARGETS}; do
            for suffix in "" .sig .cert .bundle.json; do
              files+=("NVRC-${target}.tar.xz${suffix}")
            done
          done
          # The attestation covers the manifest digest, so these annotations
          # are what ties it to the pull request build: under
          # pull_request_target its own provenance only names the base branch.
          #
          # The digest comes from the push itself, not from resolving the tag
          # afterwards: pull requests sharing a head sha push to the same tag
          # concurrently.
          digest="$(oras push "${image}:${HEAD_SHA}" \
            --format json \
            --artifact-type application/vnd.nvidia.nvrc.release \
            --annotation "org.opencontainers.image.revision=${HEAD_SHA}" \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GH_REPO}" \
            --annotation "com.nvidia.nvrc.pull-request=${PR_URL}" \
            --annotation "com.nvidia.nvrc.build-run=${BUILD_RUN_URL}" \
            "${files[@]}" | jq -r .digest)"
          case "${digest}" in
          sha256:*) ;;
          *)
            echo "::error::no digest for ${image}:${HEAD_SHA}"
            exit 1
            ;;
          esac
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

  attest:
    name: Record provenance
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # sign the provenance
      attestations: write # persist the attestation
      contents: read # actions/attest reads the repository
      packages: write # attach the attestation to the artefact
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest the published artefacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.publish.outputs.image }}
          subject-digest: ${{ needs.publish.outputs.digest }}
          push-to-registry: true

  report:
    name: Report the result and remove the label
    needs: [announce, publish, attest]
    if: ${{ !cancelled() && github.event.label.name == 'publish-nvrc-from-pr' }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write # comment on the pull request and remove the label
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Update the status comment
        env:
          COMMENT_ID: ${{ needs.announce.outputs.comment_id }}
          RESULT: ${{ needs.publish.result }}
          ATTEST: ${{ needs.attest.result }}
          ERROR: ${{ needs.announce.outputs.error }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "${COMMENT_MARKER}"
            case "${RESULT}" in
            success)
              if [ "${ATTEST}" != "success" ]; then
                echo "Pushed the NVRC artefacts for ${HEAD_SHA}, but recording their provenance failed ([workflow run](${RUN_URL}))."
              else
                echo "Published the NVRC artefacts for ${HEAD_SHA} ([workflow run](${RUN_URL})) as \`${IMAGE}@${DIGEST}\`."
                echo
                echo "To test them in kata-containers, pin \`externals.nvrc\` in \`versions.yaml\` to:"
                echo
                echo '```yaml'
                echo "    version: \"${HEAD_SHA}\""
                echo "    url: \"oci://${IMAGE}\""
                echo '```'
                echo
                echo "Kata's \`check-nvrc-is-released\` static check keeps such a pin from being merged; only released NVRC may ship."
              fi
              ;;
            *)
              echo "Failed to publish the NVRC artefacts for ${HEAD_SHA} ([workflow run](${RUN_URL}))."
              if [ -n "${ERROR}" ]; then
                echo
                echo "${ERROR}"
              fi
              ;;
            esac
          } > body.md
          if [ -n "${COMMENT_ID}" ]; then
            gh api --method PATCH "repos/${GH_REPO}/issues/comments/${COMMENT_ID}" -F body=@body.md > /dev/null
          else
            gh api --method POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" -F body=@body.md > /dev/null
          fi

      - name: Remove the label
        if: ${{ !cancelled() }}
        run: gh pr edit "${PR_NUMBER}" --remove-label publish-nvrc-from-pr

      - name: Fail when nothing was published
        if: ${{ needs.publish.result != 'success' || needs.attest.result != 'success' }}
        run: exit 1
